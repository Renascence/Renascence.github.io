# ============================================================
# NexT 主题配置 (Alternate Theme Config)
# 该文件会覆盖 node_modules/hexo-theme-next/_config.yml 的默认值
# 文档: https://theme-next.js.org/docs/getting-started/configuration
# ============================================================

# 主题布局风格（与旧版保持一致）
scheme: Muse

# 深色模式
darkmode: true

# 菜单（与旧版一致：首页 + 归档）
menu:
  home: / || fa fa-home
  archives: /archives/ || fa fa-archive

menu_settings:
  icons: true
  badges: false

# 侧边栏
sidebar:
  position: left
  display: post
  padding: 18
  offset: 12

# 站点状态（文章/分类/标签数）
site_state: true

# 社交链接
social:
  GitHub: https://github.com/Renascence || fab fa-github

social_icons:
  enable: true
  icons_only: false
  transition: false

# 目录
toc:
  enable: true
  number: true
  wrap: false

# 文章设置
excerpt_description: true
read_more_btn: true

post_meta:
  updated_at:
    enable: true
    another_day: true

# 阅读进度
reading_progress:
  enable: false

# 图片灯箱
fancybox: true

# 页脚
footer:
  powered: true

# Mermaid 流程图 / 时序图 / 甘特图支持
# 注意：NexT 8 只识别 {% mermaid %} 标签，```mermaid 围栏由 scripts/mermaid-fence.js 自动转换
# 版本与 CDN 由主题 _vendors.yml 统一管理，此处无需指定 version / cdn
mermaid:
  cdn: https://cdn.bootcdn.net/ajax/libs/mermaid/10.9.1/mermaid.min.js
  enable: true
  theme:
    light: default    # 日间模式主题：default / forest / neutral / dark
    dark: dark        # 暗黑模式主题